<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        p,ul,div{
            margin:10px 0;
            padding: 10px;
        }
        p,ul li{
            color: #333;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: #f4f4f4;
        }
        .style1 {
            color: red;
            font-family: 'Courier New', Courier, monospace;
        }
        .style2 {
            color: green;
            font-family: 'Georgia', serif;
        }
        .style3 {
            color: blue;
            font-family: 'Verdana', sans-serif;
        }
        .style4{
            color: rgb(14, 136, 167);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        .style5 {
            color: rgb(218, 137, 31);
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

    </style>
</head>
<body>
    <h2>Append content</h2>
    <p id="para">This is an existing paragraph</p>
    <ul id="list">
        <li>Item 1</li>
        <li>Item 2</li>
    </ul>
    <button id="appendBtn">Append content</button>
    <h2>Animate element</h2>
    
    <div class="box" id="animateBox"></div>
    <button id="animateBtn">Animate Box</button>

    <div class="box" id="animateBox1"></div>
    <button id="animateBtn1">Animate Box</button>

    <script>
        $(document).ready(function(){
            let itemcount=$('#list li').length;
            const styles = ['style1', 'style2', 'style3', 'style4', 'style5'];
            $('#appendBtn').click(()=>{
                itemcount++;
                const styleClass = styles[(itemcount - 1) % styles.length];
                $('#para').append(` <span class="${styleClass}">Append text ${itemcount}</span>`);
                $('#list').append(`<li class="${styleClass}">Item ${itemcount}</li>`);
                
            });
        });

        $('#animateBtn').click(()=>{
            $('#animateBox').css({width:'100px',height:'100px','background-color':'#f4f4f4'})
            .animate({width:'150px',height:'150px'},500,function(){
                $(this).css('background-color','lightblue');
            });
        });

        $('#animateBtn1').click(()=>{
            $('#animateBox1').css({width:'100px',height:'100px','background-color':'#f4f4f4'})
            .animate({width:'150px',height:'150px'},500,function(){
                $(this).css('background-color','orange');
            });
        });
    </script>
</body>
</html>
