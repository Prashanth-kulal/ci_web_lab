<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgb(235, 178, 65);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .calculator h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .calculator input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .buttons button {
            padding: 10px;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
         
        }

        .buttons button:hover {
            background: #0056b3;
        }

        #result {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>Simple Calculator</h2>
        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">

        <div class="buttons">
            <button onclick="calculate('sum')">Sum</button>
            <button onclick="calculate('difference')">Difference</button>
            <button onclick="calculate('product')">Product</button>
            <button onclick="calculate('quotient')">Quotient</button>
            <button onclick="calculate('remainder')">Remainder</button>
            <button onclick="calculate('power')">Power</button>
            <button onclick="calculate('square')">Square (Num1)</button>
            <button onclick="calculate('sum')">Clear</button>
        </div>

        <div id="result">Result: </div>
    </div>


    </div>

    <script>
        function calculate(operation) {
            const num1 = parseFloat(document.getElementById("num1").value);
            const num2 = parseFloat(document.getElementById("num2").value);
            let result;
        switch(operation){
            case 'sum':
                result=num1+num2;
                break;
            case 'difference':
                result=num1-num2;
                break;
            case 'product':
                result=num1*num2;
                break;
            case 'quotient':
                result=num1/num2;
                break;
            case 'remainder':
                result=num1%num2;
                break;
        }
        document.getElementById("result").textContent = "Result: " + result;
    }
    </script>
</body>

</html>
